<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding harness</title>
  <script>
    // Optional: force light theme via ?theme=light
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/onboarding-wizard.css" />
</head>
<body>
  <!-- A fake dashboard behind the wizard so the dimmed backdrop is visible. -->
  <div style="padding:24px;font-family:sans-serif">
    <h1>Dashboard (behind the wizard)</h1>
    <p>Lorem ipsum content so the backdrop scrim/dot-grid reads over something.</p>
  </div>

  <script>
    // Stub every network call the wizard makes so it runs with no backend.
    var RATE_CARDS = [
      { id: 'r1', label: 'Dry-Van FTL', service: 'FTL', equipment: '53′ Van', ratePerMile: 2.85, flatFee: 0, minimumCharge: 0, sortOrder: 1 },
      { id: 'r2', label: 'Reefer', service: 'Reefer', equipment: '53′ Reefer', ratePerMile: 3.10, flatFee: 0, minimumCharge: 0, sortOrder: 2 },
      { id: 'r3', service: 'LTL', equipment: 'Partial', ratePerMile: 0, flatFee: 0, minimumCharge: 120, sortOrder: 3 },
    ];
    window.fetch = function (url, opts) {
      url = String(url);
      var body = { ok: true };
      if (url.indexOf('/api/tenant/rate-cards') !== -1 && (!opts || (opts.method || 'GET') === 'GET')) {
        body = { rateCards: RATE_CARDS };
      }
      return Promise.resolve({
        ok: true, status: 200,
        json: function () { return Promise.resolve(body); },
        text: function () { return Promise.resolve(JSON.stringify(body)); },
        headers: { getSetCookie: function () { return []; } },
      });
    };
  </script>
  <script src="/onboarding-wizard.js"></script>
  <script>
    window.QFOnboardingWizard.open({
      me: { tenant: { slug: 'harborlink', hostedUrl: 'https://harborlink.quotefleet.net' } },
      onDone: function () { document.title = 'wizard done'; },
    });
  </script>
</body>
</html>
