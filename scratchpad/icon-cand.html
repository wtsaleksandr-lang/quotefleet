<!doctype html><meta charset=utf-8><body style="margin:0;background:#0b0f15;color:#fff;font:13px sans-serif;padding:30px">
<div id=row style="display:flex;flex-wrap:wrap;gap:20px"></div>
<script>
const cands={
 // INSTANT QUOTES options
 'bolt (instant)':'<path d="M13 2 5 13h5l-1 9 8-12h-5l1-8z" fill="currentColor" stroke="none"/>',
 'stopwatch':'<circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5"/><path d="M12 13.5l3 2"/><path d="M9.5 3.5h5M12 3.5v3"/><path d="M18.5 7.5l1.5-1.5"/>',
 'gauge (fast)':'<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4.5-4"/><circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/>',
 // SAVES YOU HOURS options
 'hourglass':'<path d="M6.5 3.5h11M6.5 20.5h11"/><path d="M7.5 3.5c0 4 4.5 4.8 4.5 8.5s-4.5 4.5-4.5 8.5"/><path d="M16.5 3.5c0 4-4.5 4.8-4.5 8.5s4.5 4.5 4.5 8.5"/><path d="M9 18.5h6" stroke-width="2"/>',
 'clock+rewind':'<path d="M4.5 9.5A8 8 0 1 1 4 13" /><path d="M4.5 5v4.5H9"/><path d="M12.5 8.5V13l3 2" stroke-width="1.5"/>',
 'clock+check':'<circle cx="11" cy="11" r="7"/><path d="M11 7.5V11l2.3 1.4"/><circle cx="18" cy="18" r="4" fill="currentColor" stroke="none"/><path d="M16.3 18l1.1 1.1 2-2.4" stroke="#0b0f15" stroke-width="1.5"/>',
};
const R=document.getElementById('row');
for(const [name,svg] of Object.entries(cands)){
 const c=document.createElement('div');c.style.cssText='text-align:center';
 c.innerHTML=`<div style="display:flex;gap:14px;align-items:center;justify-content:center">
   <div style="width:96px;height:96px;border:2px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg style="width:70px;height:70px;color:#fff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${svg}</svg></div>
   <div style="width:30px;height:30px;border:1px solid #444;border-radius:50%;background:rgba(9,12,18,.55);display:flex;align-items:center;justify-content:center"><svg style="width:18px;height:18px;color:#fff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${svg}</svg></div>
 </div><div style="margin-top:8px">${name}</div>`;
 R.appendChild(c);
}
</script></body>
