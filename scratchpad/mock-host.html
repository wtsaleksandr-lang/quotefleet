<!doctype html>
<html>
<head><meta charset="utf-8"><title>Third-party host page</title></head>
<body style="margin:0;font-family:system-ui;background:#eef2f7;">
  <header style="padding:24px;background:#0b1f3a;color:#fff;">Acme Shipper — a customer's own website (mock third-party host)</header>
  <p style="padding:16px 24px;">Below is the pasted QuoteFleet embed. The iframe must auto-grow to fit its content.</p>
  <div id="host-slot" style="padding:0 24px 48px;"></div>
  <footer style="padding:24px;background:#0b1f3a;color:#fff;">Footer of the host page — should sit BELOW the fully-expanded widget, not overlap it.</footer>

  <!-- Real generated embed.js loader (listener code copied byte-for-byte from
       GET /embed.js?t=6nlj7JBRWb3ClPf0cPTjxVhG; only ifr.src is repointed from
       demo.drayagerate.online to the local widget so it loads on localhost). -->
  <script id="embed-anchor">
  (function(){
    var d=document,
        me=d.getElementById('embed-anchor'),
        mount=d.getElementById('host-slot');
    var div=d.createElement('div');
    div.id='qf-widget-demo';
    div.style.cssText='width:100%;max-width:560px;margin:0 auto;';
    var ifr=d.createElement('iframe');
    // Real tenants embed the bare widget directly (serveWidgetPage serves it at
    // ?embed=1). The 'demo' slug alone is special-cased to a showcase shell, so
    // here we point at the equivalent bare widget (?raw=1) that runs widget.js
    // and posts QF_WIDGET_HEIGHT — an exact stand-in for a real tenant embed.
    ifr.src="http://localhost:8854/w/demo?raw=1";
    ifr.style.cssText='width:100%;border:0;display:block;min-height:660px;';
    ifr.setAttribute('loading','lazy');
    ifr.setAttribute('title','Instant freight quote');
    ifr.setAttribute('allow','clipboard-write');
    ifr.id='qf-embed-iframe';
    div.appendChild(ifr);
    mount.appendChild(div);
    // ---- BEGIN listener copied verbatim from generated embed.js ----
    window.addEventListener('message', function(e){
      if(!e || !e.data) return;
      if(e.source !== ifr.contentWindow) return;
      var h;
      if(e.data.type==='QF_WIDGET_HEIGHT' && typeof e.data.height==='number') h=e.data.height;
      else if(e.data.qf==='resize' && e.data.slug==="demo" && typeof e.data.h==='number') h=e.data.h;
      if(typeof h==='number' && h>0) ifr.style.height=h+'px';
    });
    // ---- END listener ----
  })();
  </script>
</body>
</html>
