# PRODUCTION UPTIME MONITOR
#
# WHY THIS EXISTS. On 2026-09-08 quotefleet.net returned 502 on every route for
# roughly a day — homepage, pricing, signup, both tools, health check. Payments
# were live throughout. Nobody found out from a monitor; it surfaced only
# because a launch-readiness audit happened to probe the site.
#
# A day of silent downtime on a product that can take money is worse than the
# outage itself, and the root cause had already been fixed once and lost. So the
# point of this file is not to prevent outages — it is to make them IMPOSSIBLE
# TO NOT NOTICE.
#
# WHY GITHUB ACTIONS RATHER THAN A MONITORING SERVICE. It is free, there is no
# account to create, no key to store and rotate, and no vendor that can quietly
# lapse. GitHub already emails on a failed workflow run, so the alerting path is
# one that is already trusted and already watched. The tradeoffs are honest:
# scheduled runs are best-effort and can be delayed by several minutes under
# load, and GitHub disables schedules in repositories with no activity for 60
# days. Neither matters here — this repo is worked on constantly, and the goal
# is "know within minutes", not sub-second paging.
#
# WHAT IT CHECKS, AND WHY THESE THREE
#   /healthz   the liveness contract. Zero logic, no database. If this fails the
#              process is not serving at all.
#   /          the route Replit's own platform probe actually hits, which is
#              what the September outage turned on. It must stay fast AND
#              database-free; if it regresses to a tenant lookup that can hang,
#              this catches it before the platform does.
#   the OS/OW  a real product surface that renders from compiled data with no
#   calculator database, so it proves the app is genuinely serving pages rather
#              than only answering a trivial endpoint.
#
# It deliberately does NOT check a route that needs the database. A Neon hiccup
# is not an outage, and a monitor that cries wolf gets muted — which is how you
# end up back where this started.
name: uptime

on:
  schedule:
    # Every 5 minutes is the finest granularity GitHub schedules accept.
    - cron: '*/5 * * * *'
  # So a human can confirm the monitor itself still works without waiting.
  workflow_dispatch:

# A backlog of delayed runs helps nobody — only the newest check matters.
concurrency:
  group: uptime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production
        run: |
          set -uo pipefail
          BASE="https://quotefleet.net"
          FAILED=0

          # Two attempts, 20s apart. A single failed request is not an outage —
          # a redeploy, a cold start or one dropped connection would otherwise
          # fire an alert every time the app is republished. Two consecutive
          # failures 20 seconds apart is a real one.
          check() {
            local path="$1" label="$2" attempt code
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$path" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK    $label ($path) -> $code"
                return 0
              fi
              echo "  attempt $attempt: $label ($path) -> $code"
              [ "$attempt" = "1" ] && sleep 20
            done
            echo "FAIL  $label ($path) -> $code after 2 attempts"
            FAILED=1
            return 0
          }

          check "/healthz"                 "liveness"
          check "/"                        "homepage (the route Replit probes)"
          check "/tools/oversize-permits"  "OS/OW calculator"

          if [ "$FAILED" = "1" ]; then
            echo
            echo "::error::quotefleet.net is DOWN. Check the Replit deployment:"
            echo "::error::  1. Replit -> QuoteFleet -> Logs, for the reason"
            echo "::error::  2. Republish if the deployment stopped"
            echo "::error::  3. If the homepage alone fails, the platform probe path"
            echo "::error::     regressed to a database-dependent response — see af5578d"
            exit 1
          fi

          echo
          echo "All production surfaces responding."
