<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>(function(){try{var t=localStorage.getItem('qf-theme');if(t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');else document.documentElement.setAttribute('data-theme','light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrier marketplace — QuoteFleet</title>
  <meta name="description" content="Find trucking carriers, brokers, and freight forwarders by lane, equipment, and service. Free for shippers — book directly with carriers.">
  <link rel="canonical" href="https://quotefleet.net/marketplace">
  <link rel="stylesheet" href="/style.css">
  <style>
    .mp-shell { max-width: 1100px; margin: 0 auto; padding: 28px; }
    .mp-filters { display: grid; gap: 12px; grid-template-columns: 1fr 1fr 1fr auto; margin-bottom: 22px; }
    @media (max-width: 720px) { .mp-filters { grid-template-columns: 1fr 1fr; } }
    .mp-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .mp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; }
    .mp-card h3 { margin: 0 0 6px 0; font-size: 18px; }
    .mp-meta { font-size: 12px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
    .mp-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .mp-pill { font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; background: var(--surface-2); border-radius: 4px; color: var(--ink-soft); }
    .mp-empty { padding: 60px 24px; text-align: center; color: var(--muted); }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F6F8FA">
  <meta property="og:image" content="https://quotefleet.net/brand/og-image-1200x630.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://quotefleet.net/brand/og-image-1200x630.png">
</head>
<body>
  <!--qf:site-header-->

  <section class="hero" style="padding-bottom: 30px;">
    <div class="container-narrow">
      <h1 style="font-size: 44px;">Carrier marketplace</h1>
      <p class="lead">Find trucking carriers + freight forwarders by lane and service. Free for shippers and carriers — small commission per booked shipment.</p>
    </div>
  </section>

  <main class="mp-shell">
    <div class="mp-filters">
      <select class="select" id="mp-service">
        <option value="">All services</option>
        <option value="ftl">Truckload (FTL)</option>
        <option value="ltl">LTL</option>
        <option value="drayage">Drayage</option>
        <option value="expedited">Expedited</option>
      </select>
      <select class="select" id="mp-country">
        <option value="">All countries</option>
        <option value="US">USA</option>
        <option value="CA">Canada</option>
      </select>
      <input class="input" id="mp-port" placeholder="Port code (e.g. USLAX)">
      <button class="btn btn-primary" id="mp-search">Search <span class="arr">→</span></button>
    </div>

    <div id="mp-results"></div>
    <div id="mp-empty" class="mp-empty hidden">No carriers match these filters yet. As more carriers opt in, the directory grows.</div>
  </main>

  <!--qf:site-footer-->

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var $ = function (id) { return document.getElementById(id); };

    function search() {
      var qs = new URLSearchParams();
      if ($('mp-service').value) qs.set('service', $('mp-service').value);
      if ($('mp-country').value) qs.set('country', $('mp-country').value);
      if ($('mp-port').value) qs.set('port', $('mp-port').value.trim().toUpperCase());
      fetch('/api/marketplace/carriers?' + qs.toString())
        .then(function (r) { return r.json(); })
        .then(function (j) { render(j.carriers || []); })
        .catch(function () { render([]); });
    }
    function render(carriers) {
      var grid = $('mp-results'); grid.className = 'mp-grid'; grid.innerHTML = '';
      $('mp-empty').classList.toggle('hidden', carriers.length > 0);
      carriers.forEach(function (c) {
        var card = document.createElement('a');
        card.className = 'mp-card';
        card.style.display = 'block';
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';
        card.href = '/marketplace/carrier/' + encodeURIComponent(c.slug);
        var meta = (c.countryFocus || '') + (c.mcNumber ? ' · MC ' + c.mcNumber : '') + (c.dotNumber ? ' · DOT ' + c.dotNumber : '');
        card.innerHTML =
          '<h3>' + esc(c.displayName) + '</h3>' +
          '<div class="mp-meta">' + esc(meta) + '</div>' +
          '<div class="mp-pills">' +
            (c.services || []).map(function (s) { return '<span class="mp-pill">' + esc(s) + '</span>'; }).join('') +
          '</div>';
        grid.appendChild(card);
      });
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]); }); }
    $('mp-search').addEventListener('click', search);
    search();
  </script>
<script src="/marketing-chat.js" defer></script>
  <script src="/theme-toggle.js" defer></script>
</body>
</html>
