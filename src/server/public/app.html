  <script>
    (function () {
      // Explicit user-controlled day/night theme. Default = dark (brand),
      // matching the always-dark public marketing site. The saved choice is
      // applied here — before first paint — so there is no light/dark flash.
      // NOT tied to OS prefers-color-scheme; only the sidebar toggle flips it.
      try {
        if (localStorage.getItem('qf-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) { /* default dark */ }
    })();
  </script>

  <style>
    /* Progressive nav — the Advanced disclosure. The summary mimics a muted
       .nav-item (same metrics as .sidebar button in style.css); the chevron
       rotates when open. Collapsed by default (no [open] attribute). */
    .qf-nav-advanced > summary { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--muted); font-size: 13px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; border-left: 3px solid transparent; user-select: none; list-style: none; }
    .qf-nav-advanced > summary::-webkit-details-marker { display: none; }
    .qf-nav-advanced > summary:hover { background: var(--surface-2); color: var(--ink); }
    .qf-nav-advanced .qf-nav-adv-chevron { flex: 0 0 auto; transition: transform 0.15s ease; }
    .qf-nav-advanced[open] > summary .qf-nav-adv-chevron { transform: rotate(90deg); }

    /* ══ STATIC PORTAL TOP BAR ═══════════════════════════════════════════════
       A sticky, full-width strip. Being position:sticky it reserves its own
       height in normal flow, so the sidebar + content sit below it without any
       manual body offset. Tokens only (this block is theme-aware via var(--*)).
       Desktop height is pinned (--qf-topbar-h) so the sticky sidebar can offset
       against it exactly; mobile height is content-driven (announcement wraps to
       its own row). */
    :root { --qf-topbar-h: 56px; }
    .qf-topbar {
      position: sticky; top: 0; z-index: 1002;
      display: flex; align-items: center; gap: 16px;
      min-height: var(--qf-topbar-h);
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .qf-topbar[hidden] { display: none; }
    .qf-topbar-left { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; min-width: 0; }
    .qf-topbar-center { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
    .qf-topbar-right { flex: 0 0 auto; display: flex; align-items: center; }
    .qf-topbar-logo { display: inline-flex; align-items: center; text-decoration: none; }
    .qf-topbar-logo .qf-sb-logo-img { height: 24px; width: auto; display: block; }
    .qf-topbar-logo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    /* On-dark art in dark theme, full-color in light. */
    .qf-topbar-logo .qf-sb-logo-onlight { display: none; }
    .qf-topbar-logo .qf-sb-logo-ondark { display: block; }
    html[data-theme="light"] .qf-topbar-logo .qf-sb-logo-ondark { display: none; }
    html[data-theme="light"] .qf-topbar-logo .qf-sb-logo-onlight { display: block; }

    /* Sidebar toggle — a flex child of the top bar's left zone (no longer a
       floating fixed control). Hidden on desktop; shown ≤900px, or on desktop
       only when the sidebar is explicitly collapsed (class mirrored onto the
       top bar by wireMobileNav). */
    .qf-mobile-nav-toggle { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius-btn); border: 1px solid var(--border-strong); background: var(--surface); padding: 0; cursor: pointer; color: var(--ink); transition: background 0.15s ease; }
    .qf-mobile-nav-toggle:hover { background: var(--surface-2); }
    @media (max-width: 900px) { .qf-mobile-nav-toggle { display: inline-flex; } }
    @media (min-width: 901px) { .qf-topbar.qf-nav-collapsed .qf-mobile-nav-toggle { display: inline-flex; } }

    /* ── Account dropdown ─────────────────────────────────────────────────── */
    .qf-account { position: relative; }
    .qf-account-trigger {
      display: inline-flex; align-items: center; gap: 8px;
      max-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .qf-account-trigger:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .qf-account-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .qf-account-avatar { flex: 0 0 auto; width: 18px; height: 18px; color: var(--muted); }
    .qf-account-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qf-account-caret { flex: 0 0 auto; color: var(--muted); transition: transform 0.15s ease; }
    .qf-account-trigger[aria-expanded="true"] .qf-account-caret { transform: rotate(180deg); }
    .qf-account-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 1003;
      min-width: 240px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column; gap: 4px;
    }
    .qf-account-menu[hidden] { display: none; }
    .qf-account-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0; border-radius: var(--radius-btn);
      background: transparent;
      color: var(--ink);
      font-size: 13px; font-weight: 600;
      text-align: left; cursor: pointer;
    }
    .qf-account-item .qf-ico { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); }
    .qf-account-item:hover { background: var(--surface-2); }
    .qf-account-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .qf-account-theme {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 4px 0;
    }
    .qf-account-theme-label { font-size: 13px; font-weight: 600; color: var(--ink); }

    /* Real Dark/Light SWITCH — a sliding track + knob. Reuses #qf-theme-toggle /
       #qf-theme-icon / #qf-theme-label so wireThemeToggle() drives it; aria as a
       role="switch" (aria-checked reflects Light). Base .qf-theme-toggle border/
       padding from style.css are reset here. */
    .qf-theme-switch {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 0; border: 0; background: transparent; cursor: pointer;
    }
    .qf-theme-switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-btn); }
    .qf-theme-switch-name { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 34px; text-align: right; }
    .qf-theme-switch-track {
      position: relative; flex: 0 0 auto;
      width: 44px; height: 24px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .qf-theme-switch[aria-checked="true"] .qf-theme-switch-track { background: var(--accent-fill); border-color: var(--accent-fill); }
    .qf-theme-switch-knob {
      position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-pill);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      transition: transform 0.18s ease;
    }
    .qf-theme-switch[aria-checked="true"] .qf-theme-switch-knob { transform: translateX(20px); }
    .qf-theme-switch-ico { display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
    .qf-theme-switch-ico .qf-ico { width: 12px; height: 12px; }
    .qf-theme-switch[aria-checked="true"] .qf-theme-switch-ico { color: var(--accent-fill); }

    /* Skip link — off-screen until keyboard-focused, then pinned top-left so a
       keyboard user can jump straight past the sidebar into the page content. */
    .qf-skip-link { position: fixed; top: 8px; left: 8px; z-index: 1100; transform: translateY(-150%); transition: transform 0.12s ease; background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 700; text-decoration: none; }
    .qf-skip-link:focus { transform: translateY(0); outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Sidebar sits below the sticky bar. Its own sticky offset = the bar height
       so it pins just under the bar on scroll (desktop). Light shell keeps its
       14px inset. */
    @media (min-width: 901px) {
      .sidebar { top: var(--qf-topbar-h); height: calc(100vh - var(--qf-topbar-h)); }
      html[data-theme="light"] .sidebar { top: calc(var(--qf-topbar-h) + 14px); height: calc(100vh - var(--qf-topbar-h) - 28px); }
      .app-shell.qf-nav-collapsed .sidebar { display: none; }
      .app-shell.qf-nav-collapsed .app-main { margin-left: 0; }
      .qf-nav-scrim { display: none; }
    }
    /* ≤900px: sidebar is an off-canvas drawer. It slides UNDER the sticky bar
       (top offset = bar height) so the logo + account stay reachable while open;
       the scrim dims the rest. */
    @media (max-width: 900px) {
      /* Two-row bar: hamburger + logo + account on row 1, the announcement pill
         wrapping to a full-width row 2 (so nothing crowds at 375px). */
      .qf-topbar { flex-wrap: wrap; row-gap: 8px; gap: 12px; }
      .qf-topbar-center { order: 3; flex: 1 0 100%; }
      /* Row 1 = logo/hamburger (left) + account (far right). Both zones are
         `flex: 0 0 auto`, and the announcement (center) has wrapped to its own
         full-width row 2 — so without this the account button clustered next to
         the logo in the MIDDLE of the bar. margin-left:auto eats the free space
         on row 1 and pins the account trigger to the TOP-RIGHT corner. */
      .qf-topbar-right { margin-left: auto; }
      .qf-account-trigger { max-width: 160px; }
      /* Keep the dropdown panel inside the 375px viewport: never wider than the
         screen minus the bar's 16px side gutters, and clamp its min-width so a
         narrow phone can't force horizontal overflow. */
      .qf-account-menu { min-width: 0; width: max-content; max-width: calc(100vw - 32px); }
      .app-shell .sidebar { position: fixed; top: var(--qf-bar-h, 56px); left: 0; bottom: 0; width: 260px; max-width: 80vw; padding-top: 8px; transform: translateX(-100%); transition: transform 0.18s ease; z-index: 1000; box-shadow: 4px 0 20px rgba(0,0,0,0.2); overflow-y: auto; }
      .app-shell.qf-nav-open .sidebar { transform: translateX(0); }
      .qf-nav-scrim { position: fixed; inset: 0; background: rgba(8, 11, 20, 0.55); opacity: 0; visibility: hidden; transition: opacity 0.18s ease, visibility 0.18s ease; z-index: 999; }
      .app-shell.qf-nav-open .qf-nav-scrim { opacity: 1; visibility: visible; }
      /* Sticky bar already reserves its own height in flow, so the old 72px
         hamburger-band top padding is no longer needed — trim it to breathing room. */
      .app-main { padding-top: 24px; }
      html[data-theme="light"] .app-main { padding-top: 24px; }
    }
    html[data-theme="light"] .qf-nav-scrim { background: rgba(15, 23, 42, 0.42); }

    body.qf-trial-locked .app-main input, body.qf-trial-locked .app-main select, body.qf-trial-locked .app-main textarea { pointer-events: none; opacity: 0.55; cursor: not-allowed; }
    body.qf-trial-locked .app-main .btn-primary, body.qf-trial-locked .app-main .btn-danger, body.qf-trial-locked .app-main button[data-mutate] { pointer-events: none; opacity: 0.55; cursor: not-allowed; }
  </style>
