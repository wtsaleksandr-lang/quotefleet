<title>Supply Chain Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
  /* ImportYeti is a bright, always-white tool — this design is deliberately
     LIGHT-ONLY (no dark theme) so it reads the same on any device, and the
     accent is a Yeti-style teal (shifted from their exact cyan) rather than
     a saturated blue. */
  :root{
    color-scheme:light;
    --bg:#ffffff; --alt:#f4f8fa; --panel:#ffffff;
    --ink:#123243; --text:#3b4a54; --muted:#6a7883; --faint:#9aa6b0;
    --line:#e7ecef; --line2:#d6dfe4;
    --nav:#0f3b4d;                      /* dark teal-navy — logo/header text */
    --accent:#12a6c4; --accent-weak:#e4f6fa; --accent-mid:#bfe8f0;
    --link:#1f7fc4;                     /* friendly blue — company-name links */
    --pill-imp:#0f3b4d; --pill-sup:#e7ecef;
    --good:#0f7a52; --good-weak:#e7f4ee;
    --warn:#9a5b12; --warn-weak:#fbf1e3;
    --shadow:0 1px 3px rgba(18,50,67,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font-family:"Nunito Sans","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .logo .wm,.c-name,.sec-h,.p-title h1,.stat .sv,.cell .val,.sv{font-family:"Nunito","Nunito Sans",sans-serif}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ── top bar ─────────────────────────────────────────── */
  .top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .top-in{max-width:1080px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:18px}
  .logo{display:flex;align-items:center;gap:8px;flex:0 0 auto;text-decoration:none}
  .logo .mk{width:30px;height:30px;border-radius:8px;background:var(--nav);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .logo .mk svg{width:17px;height:17px}
  .logo .wm{font-weight:800;font-size:18px;color:var(--nav);letter-spacing:-.01em;white-space:nowrap}
  .logo .wm b{color:var(--accent);font-weight:800}
  .searchbar{flex:1 1 auto;display:flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:2px 3px 2px 16px;background:var(--panel);min-width:0}
  .searchbar input{flex:1 1 auto;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px;padding:8px 0;min-width:0}
  .searchbar input::placeholder{color:var(--faint)}
  .sbtn{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--accent);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sbtn svg{width:16px;height:16px;stroke:#fff}
  .top-nav{display:flex;align-items:center;gap:16px;flex:0 0 auto}
  .top-nav a{color:var(--nav);font-weight:500;font-size:13.5px}
  .acct{border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
  .acct:hover{text-decoration:none;background:var(--accent-weak)}
  @media(max-width:720px){.top-nav a:not(.acct){display:none}.logo .wm{display:none}}

  /* ── view switch (mockup convenience) ─────────────────── */
  .vswitch{border-bottom:1px solid var(--line);background:var(--panel)}
  .vswitch-in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
  .vtab{appearance:none;border:0;background:transparent;padding:12px 4px;margin-right:22px;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .vtab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .vtab:hover{color:var(--ink)}

  /* ── filters ─────────────────────────────────────────── */
  .subnav{display:flex;gap:24px;padding:10px 0 0;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .subnav a{color:var(--muted);font-weight:600;font-size:13.5px;padding-bottom:10px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .subnav a.on{color:var(--nav);border-bottom-color:var(--accent)}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 6px}
  .sel{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;background:var(--panel);font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
  .sel .cv{font-weight:600;color:var(--ink)}
  .sel svg{width:12px;height:12px;stroke:var(--muted)}
  .filters .adv{margin-left:auto;color:var(--accent);font-weight:600;font-size:13px}
  .aud{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
  .aud button{appearance:none;border:0;background:transparent;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
  .aud button:last-child{border-right:0}
  .aud button.on{background:var(--accent);color:#fff}
  .incl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;margin:8px 0 0}
  .incl input{accent-color:var(--accent)}
  .audhint{background:var(--accent-weak);border:1px solid var(--accent-mid);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--nav);margin:12px 0 2px}
  .audhint b{color:var(--accent)}
  .rescount{color:var(--muted);font-size:12.5px;margin:16px 0 12px}
  .rescount b{color:var(--ink);font-weight:600}

  /* ── result card ─────────────────────────────────────── */
  .card{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel);
    padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .c-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:3px}
  .c-name{font-size:17px;font-weight:700;color:var(--link)}
  .c-name:hover{text-decoration:underline;cursor:pointer}
  .flag{font-size:15px;line-height:1}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
  .pill.imp{background:var(--pill-imp);color:#fff}
  .c-addr{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .c-lane{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--text);margin-bottom:11px}
  .c-lane .fl{color:var(--muted)}
  .c-lane .arw{color:var(--faint)}
  .c-lane .prod{color:var(--muted)}
  .grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-top:12px;border-top:1px solid var(--line)}
  .cell .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
  .cell .val{font-size:15px;font-weight:700;color:var(--ink)}
  .cell .val.sm{font-size:13.5px;font-weight:600}
  .cell .sub{font-size:11.5px;color:var(--faint)}
  .c-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
  .incumb{font-size:12px;color:var(--warn);background:var(--warn-weak);border-radius:5px;padding:3px 9px}
  .incumb b{font-weight:700}
  .contact-lo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--nav);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;background:var(--panel);cursor:pointer;font-weight:600}
  .contact-ok{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--good);background:var(--good-weak);border-radius:6px;padding:5px 10px;font-weight:600}
  .contact-ok .who{color:var(--text);font-weight:500}
  .qlane{appearance:none;border:0;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .qlane:hover{filter:brightness(.94)}
  @media(max-width:640px){.grid3{grid-template-columns:repeat(2,1fr)}}

  /* ── profile ─────────────────────────────────────────── */
  .p-head{padding:18px 0 0}
  .p-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .p-title h1{font-size:27px;font-weight:800;color:var(--nav);margin:0;letter-spacing:-.015em}
  .p-actions{margin-left:auto;display:flex;gap:8px}
  .btn-o{border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .btn-p{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .p-meta{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:9px 0 2px}
  .p-meta .mi{display:inline-flex;align-items:center;gap:6px}
  .p-meta a{font-weight:600}

  /* our two subtle add-ons */
  .addons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
  .ad{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:13px 15px}
  .ad .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .ad .lock{display:flex;align-items:center;gap:10px}
  .ad .blur{filter:blur(4px);user-select:none;font-weight:600;color:var(--ink)}
  .ad .unlockbtn{border:1px solid var(--accent);color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .ad .disp{font-size:14px;font-weight:700;color:var(--ink)}
  .ad .disp-s{font-size:12px;color:var(--muted);margin-top:2px}
  @media(max-width:640px){.addons{grid-template-columns:1fr}}

  /* stat strip */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 6px}
  .stat{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 13px;display:flex;gap:11px;align-items:center}
  .stat .si{width:40px;height:40px;border-radius:50%;background:var(--alt);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .stat .si svg{width:19px;height:19px;stroke:var(--nav)}
  .stat .stxt{min-width:0}
  .stat .sl{font-size:11px;color:var(--muted);line-height:1.22}
  .stat .sv{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:2px}
  .stat .sx{font-size:10.5px;color:var(--faint)}
  @media(max-width:860px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* section */
  .sec{margin:26px 0 0}
  .sec-h{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 3px}
  .sec-s{font-size:12px;color:var(--muted);margin:0 0 12px}
  .panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px}

  /* bar chart */
  .chartwrap{display:flex;gap:8px}
  .chart-y{display:flex;flex-direction:column;justify-content:space-between;color:var(--faint);font-size:10.5px;padding-bottom:14px;text-align:right;flex:0 0 auto;width:22px}
  .chart{flex:1 1 auto;display:flex;align-items:flex-end;gap:1.5px;height:190px;min-width:0;
    background:linear-gradient(to top, var(--line) 1px, transparent 1px);background-size:100% 47px;background-position:left bottom;border-bottom:1px solid var(--line2)}
  .bar{flex:1 1 0;background:#12889e;border-radius:1px 1px 0 0;min-width:0;transition:opacity .1s}
  .bar:hover{opacity:.7}
  .xaxis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:8px 0 0 30px}

  /* suppliers table */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
  thead th{background:var(--alt);text-align:left;padding:9px 14px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  .sup-n{font-weight:700;color:var(--link)}
  .sup-c{font-size:11.5px;color:var(--muted)}
  .spark{display:flex;align-items:flex-end;gap:1.5px;height:26px}
  .spark i{width:3px;background:var(--line2);border-radius:1px}
  .spark i.g{background:#3aa564}
  .volbar{position:relative;height:16px;background:var(--alt);border-radius:3px;overflow:hidden;min-width:80px}
  .volbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
  .prodtxt{color:var(--text);font-size:12px;max-width:240px}
  .hschip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);background:var(--alt);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:4px;display:inline-block}
  .bol-link{font-size:11.5px}

  /* heatmap */
  .heat{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .hcell{border-radius:8px;padding:10px 12px;border:1px solid rgba(30,50,40,.06);border-left-width:4px}
  .hcell .hm{font-size:10.5px;font-weight:700;color:#4a5a52;text-transform:uppercase;letter-spacing:.03em}
  .hcell .hn{font-size:19px;font-weight:800;color:#213228;margin-top:3px;line-height:1}
  .hcell .hi{font-size:10.5px;color:#5f6f66;margin-top:1px}
  .heat-leg{display:flex;align-items:center;gap:13px;color:var(--muted);font-size:11px;margin-top:12px;flex-wrap:wrap}
  .heat-leg .lg{display:flex;align-items:center;gap:5px}
  .heat-leg i{width:15px;height:12px;border-radius:2px;display:inline-block}
  @media(max-width:560px){.heat{grid-template-columns:repeat(3,1fr)}}

  /* treemap */
  .tree{display:flex;gap:6px;height:230px}
  .tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  .tbox{border-radius:6px;padding:10px;color:#fff;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .tbox .tc{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;opacity:.9}
  .tbox .td{font-size:11px;opacity:.85;margin-top:2px;line-height:1.3}
  .tbox .tn{font-size:12px;font-weight:700;margin-top:4px}
  @media(max-width:640px){.tree{height:auto;flex-direction:column}.tcol{flex-direction:row}}

  /* relationships */
  .rel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .relrow{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
  .relrow .rs{font-weight:600;color:var(--ink);font-size:13px;display:flex;align-items:center;gap:7px}
  .relrow .rd{font-size:12px;color:var(--muted);margin-top:5px}
  .relrow .rd b{color:var(--accent);font-weight:700}
  @media(max-width:640px){.rel{grid-template-columns:1fr}}

  /* origin countries */
  .origin{display:flex;flex-direction:column;gap:9px}
  .orow{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:12px}
  .orow .oc{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:13px}
  .orow .ob{height:14px;background:var(--alt);border-radius:3px;overflow:hidden}
  .orow .ob i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .orow .ov{text-align:right;font-size:12.5px;color:var(--muted)}
  @media(max-width:560px){.orow{grid-template-columns:110px 1fr 56px}}

  /* pies */
  .pierow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .piecard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;text-align:center}
  .piecard h3{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 12px}
  .pie{border-radius:50%;margin:0 auto 12px}
  .pie-leg{display:flex;flex-direction:column;gap:5px;text-align:left;font-size:12px;color:var(--text)}
  .pie-leg .pl{display:flex;align-items:center;gap:7px}
  .pie-leg i{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
  .pie-leg b{color:var(--ink)}
  @media(max-width:720px){.pierow{grid-template-columns:1fr;max-width:340px}}
  /* toplists */
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.twocol{grid-template-columns:1fr}}
  .tl-row{display:grid;grid-template-columns:1fr auto 52px 16px;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tl-row:last-child{border-bottom:0}
  .tl-name{position:relative;padding:5px 9px;min-width:0;overflow:hidden;border-radius:5px}
  .tl-bar{position:absolute;left:0;top:0;bottom:0;background:var(--accent-weak);border-radius:5px}
  .tl-lbl{position:relative;color:var(--link);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .tl-ct{font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
  .tl-pct{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
  .up{color:#2fa35a}.dn{color:#d1483a}.eq{color:var(--faint)}
  /* lanes */
  .lane-row{display:grid;grid-template-columns:1fr 66px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .lane-row:last-child{border-bottom:0}
  .lane-p{border:1px solid var(--line2);border-radius:6px;padding:6px 10px;color:var(--link);font-weight:600;background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lane-mid{text-align:center;color:var(--muted);font-size:11px}
  .lane-arw{height:5px;background:var(--accent);border-radius:3px;margin:3px auto 0}
  .lane-x{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
  /* contact tabs */
  .ctabs{display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
  .ctab{appearance:none;border:0;background:transparent;padding:9px 2px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
  .ctab.on{color:var(--link);border-bottom-color:var(--accent)}
  .ctab .cnt{background:var(--accent-weak);color:var(--accent);border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
  .unlockmini{border:1px solid var(--line2);border-radius:5px;padding:2px 9px;font-size:11px;color:var(--nav);cursor:pointer;background:var(--panel);font-weight:600}
  .sec-hrow{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  /* AI / winnability differentiators (our edge over ImportYeti) */
  .win{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .win-hi{background:#e5f6ec;color:#1c7a45}
  .win-md{background:#fdf3e2;color:#9a6412}
  .ai-angle{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);background:var(--accent-weak);border:1px solid var(--accent-mid);border-radius:7px;padding:8px 11px;margin:11px 0 0}
  .ai-angle .z{color:var(--accent);flex:0 0 auto;font-weight:800}
  .card{transition:box-shadow .12s,border-color .12s}
  .card:hover{box-shadow:0 7px 22px -12px rgba(18,50,67,.3);border-color:var(--line2)}
  .c-name:hover,.sup-n:hover,.lane-p:hover,.bol-link:hover,.tl-lbl:hover{cursor:pointer}
  .help{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--line);color:var(--muted);font-size:9.5px;font-weight:700;align-items:center;justify-content:center;cursor:help;margin-left:4px;vertical-align:middle}
  .help:hover{background:var(--accent);color:#fff}
  .aibrief{border:1px solid var(--accent-mid);border-radius:12px;background:linear-gradient(180deg,var(--accent-weak),#fff);padding:16px 18px;margin:16px 0 4px}
  .aibrief .abh{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;color:var(--nav);margin-bottom:11px}
  .aibrief .abh .tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#fff;padding:3px 9px;border-radius:5px}
  .aibrief ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}

/* ── PROFILE VIEW ── */
function renderProfile(){
  const p = DATA.profile, root = document.getElementById("view-profile");
  const maxM = Math.max(...p.months);
  const topY = Math.ceil(maxM/250)*250;
  const bars = p.months.map((m)=>`<div class="bar" style="height:${Math.round(m/topY*100)}%" title="${N(m)} shipments"></div>`).join("");

  const supMax = Math.max(...p.suppliers.map(s=>s.ships));
  const supRows = p.suppliers.map(s=>{

    return `<tr>
      <td><div class="sup-n">${FLAG(s.country)} ${s.name}</div><div class="sup-c">${s.city}, ${s.country}</div></td>
      <td><div class="spark">${spark}</div></td>
      <td><div style="display:flex;align-items:center;gap:9px"><div class="volbar" style="flex:1"><i style="width:${Math.round(s.ships/supMax*100)}%"></i></div><span class="num" style="font-weight:600;color:var(--ink)">${N(s.ships)}</span></div></td>

  // heatmap: fold 36-month series into 12 calendar slots
  const months12 = Array(12).fill(0); p.months.forEach((m,i)=>months12[i%12]+=m);
  const hMax = Math.max(...months12), hMin = Math.min(...months12);
  const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const BANDS = [
    {bg:"#f6f0d2",bd:"#e0d494",lab:"Low"},

    {bg:"#a7d998",bd:"#6abf6d",lab:"High"},
    {bg:"#74c483",bd:"#41a058",lab:"Very high"},

  const band = v=>BANDS[Math.min(4,Math.floor(((v-hMin)/((hMax-hMin)||1))*5))];
  const heat = months12.map((v,i)=>{const b=band(v);return `<div class="hcell" style="background:${b.bg};border-left-color:${b.bd}"><div class="hm">${MO[i]}</div><div class="hn num">${N(v)}</div><div class="hi">imports</div></div>`;}).join("");
  // treemap
  const TCOL=["#0f3b4d","#12a6c4","#2f8f6b","#c08a3a","#7a6cc4","#c0655d"];
  const totHs = p.hs_breakdown.reduce((a,b)=>a+b.n,0);
  const big = p.hs_breakdown.slice(0,2), small = p.hs_breakdown.slice(2);
  const tbox=(h,i)=>`<div class="tbox" style="background:${TCOL[i%TCOL.length]};flex:${h.n}"><div class="tc">${h.hs}</div><div class="td">${h.chap}</div><div class="tn num">${N(h.n)}</div></div>`;
  const tree=`<div class="tcol" style="flex:${big.reduce((a,b)=>a+b.n,0)}">${big.map((h,i)=>tbox(h,i)).join("")}</div>
    <div class="tcol" style="flex:${small.reduce((a,b)=>a+b.n,0)}">${small.map((h,i)=>tbox(h,i+2)).join("")}</div>`;
  // HTS table rows
  const htsRows = p.hs_breakdown.map((h,i)=>`<tr><td><span class="hschip">${h.hs}</span></td><td>${h.desc}</td><td><a class="bol-link">SCFLS00${270160+i*137} →</a></td><td class="prodtxt">${p.suppliers[i]?p.suppliers[i].product:h.desc}</td></tr>`).join("");

    return `<div class="pie" style="width:${size}px;height:${size}px;background:conic-gradient(${stops})"></div>
      <div class="pie-leg">${segs.map(s=>`<div class="pl"><i style="background:${s.color}"></i>${s.label}: <b>${N(s.val)}</b> (${s.pct}%)</div>`).join("")}</div>`;
  };
  const tlRows = rows => {const mx=Math.max(...rows.map(r=>r.c));return rows.map(r=>`<div class="tl-row">
    <div class="tl-name"><span class="tl-bar" style="width:${Math.round(r.c/mx*100)}%"></span><span class="tl-lbl">${r.f?FLAG(r.f)+' ':''}${r.n}</span></div>

  const tlInner = (title,rows) => `<h2 class="sec-h" style="margin-top:0">${title}</h2><div class="panel">${tlRows(rows)}</div>`;

  const D = arr => arr.map(x=>({...x,c:cnt(x.p)}));

  const lcl=cnt(6.7), fcl=T-lcl;
  const house=cnt(63.9), reg=cnt(31.3), inbond=T-house-reg;

  const pc1 = v => +(v/T*100).toFixed(1);

function statCard(ic,label,val,sub){
